name: Daily Score Update

on:
  schedule:
    # Daily at 6am Pacific (1pm UTC), morel season only
    - cron: '0 13 * 4-7 *'
  workflow_dispatch:  # manual trigger year-round

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      # Weather cache survives between runs so:
      # (a) historical archive days, once fetched, are NEVER re-fetched
      # (b) when today's forecast fetch fails, yesterday's is the fallback
      # New key per run so the post-run save always succeeds (GH caches are
      # immutable once written). restore-keys takes the most recent prior cache.
      - name: Restore weather cache
        id: wxcache-restore
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: wxcache-${{ github.run_id }}
          restore-keys: |
            wxcache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scorer
        run: python morel_finder.py

      - name: Save weather cache
        if: always()  # save even if scorer aborted on fail-loud, so progress persists
        uses: actions/cache/save@v4
        with:
          path: cache
          key: wxcache-${{ github.run_id }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily score update $(date -u +%Y-%m-%d)"
            git push
          fi
